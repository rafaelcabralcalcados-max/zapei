         C 180 356 126 300 126 244
         C 126 196 158 164 202 174
         C 208 140 226 122 254 122
         C 282 122 300 140 306 174
         C 350 166 384 192 384 234
         C 384 278 334 308 262 308 Z"
    />
  </g>

  <!-- Centered CHATFI Wordmark -->
  <text
